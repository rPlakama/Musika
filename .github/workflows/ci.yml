name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: clippy + lib tests (nix dev shell)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # The rust toolchain itself comes from the flake; this cache only
          # persists ~/.cargo registry data and the target/ directory.
          workspaces: ". -> target"
          key: clippy-${{ hashFiles('Cargo.lock') }}

      # The flake dev shell is the single source of truth for the audio-only
      # mpv runtime and GPUI (wayland/vulkan/fontconfig) toolchain, so CI
      # builds and tests exactly the same dependency set as `nix develop`.
      - name: Clippy (warnings are errors)
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.nix-cache
        run: |
          mkdir -p "$XDG_CACHE_HOME"
          nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Lib tests
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.nix-cache
        run: nix develop --command cargo test --lib

      # The headless daemon must build and test without the GPUI feature
      # (A-01), and the io_uring reader has its own safety-critical tests.
      - name: Headless check and tests (no default features)
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.nix-cache
        run: |
          nix develop --command cargo check --no-default-features --all-targets
          nix develop --command cargo test --lib --no-default-features

      - name: io_uring reader tests
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.nix-cache
        run: nix develop --command cargo test --lib --features io-uring io_uring_read
