[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "musika"
version = "0.7.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# unsafe hygiene (highest value: lock-free ring buffer and RT callback live here)
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# every suppression says why; prefer #[expect] so stale ones fail
allow_attributes_without_reason = "warn"

# panics in production code
unwrap_used = "warn"
expect_used = "warn"        # warn only: many are real startup invariants

# swallowed results (daemon, sockets, channels)
let_underscore_must_use = "warn"
unused_result_ok = "warn"

# enum drift protection (CoreCommand, EngineEvent, IPC messages, ItemKind/RowKind/PageKind)
match_wildcard_for_single_variants = "warn"
wildcard_enum_match_arm = "warn"

# cheap perf / honest-signature lints
or_fun_call = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
unused_async = "warn"

# free insurance (currently 0 hits)
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "warn"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
material-colors = { version = "0.5", features = ["quantize"] }
nucleo = "0.5.0"
openssl = "0.10.81"
rayon = "1.12"
reqwest = { version = "0.13.5", features = [ "json", "zstd" ] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio" ] }
tokio = { version = "1.53.2", features = [ "rt", "macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "time" ] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Rust-owned audio engine (system PipeWire/FFmpeg libraries via Rust bindings).
pipewire = { version = "0.10.1", features = ["v0_3_50"] }
ffmpeg-next = { version = "9.0.0", default-features = false, features = [
  "format",
  "codec",
  "software-resampling",
] }
io-uring = { version = "0.7", optional = true }

# GPUI (Zed): hybrid immediate/retained, GPU-accelerated UI framework.
libc = "0.2"
gpui = { version = "0.2.2", optional = true, default-features = false, features = ["wayland", "x11", "font-kit"] }

[features]
default = ["gpuui"]
io-uring = ["dep:io-uring"]
# GPUI port (gpui.rs): opt-in front end on the same backend.
gpuui = ["dep:gpui"]

# GPUI 0.2.2 pulls zed-async-tar -> xattr 0.2.3, which references the
# macOS-only libc::ENOATTR on Linux. Vendored one-line ENODATA shim until a
# fixed xattr release is available.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# The app runs in a debug profile for development, but cover decoding/resizing
# is CPU-bound native work where unoptimized image codecs cost seconds per
# album. Optimise the codec stack without giving up debug info for our code.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3
