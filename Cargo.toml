[package]
name = "musika"
version = "0.1.1"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
material-colors = { version = "0.5", features = ["quantize"] }
md-5 = "0.11"
openssl = "0.10.81"
qtbridge = "0.3.0"
reqwest = { version = "0.13.5", features = [ "json" ] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio" ] }
tokio = { version = "1.53.2", features = [ "rt", "macros", "rt-multi-thread"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
