[package]
name = "musika"
version = "0.4.9"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
material-colors = { version = "0.5", features = ["quantize"] }
nucleo = "0.5.0"
openssl = "0.10.81"
qtbridge = "0.3.0"
rayon = "1.12"
reqwest = { version = "0.13.5", features = [ "json" ] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio" ] }
tokio = { version = "1.53.2", features = [ "rt", "macros", "rt-multi-thread", "fs", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
