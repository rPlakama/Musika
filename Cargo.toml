[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[package]
name = "musika"
version = "0.6.2"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
material-colors = { version = "0.5", features = ["quantize"] }
nucleo = "0.5.0"
openssl = "0.10.81"
rayon = "1.12"
reqwest = { version = "0.13.5", features = [ "json", "zstd" ] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [ "sqlite", "runtime-tokio" ] }
tokio = { version = "1.53.2", features = [ "rt", "macros", "rt-multi-thread", "fs", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# GPUI (Zed): hybrid immediate/retained, GPU-accelerated UI framework.
libc = { version = "0.2", optional = true }
gpui = { version = "0.2.2", optional = true, default-features = false, features = ["wayland", "x11", "font-kit"] }

[features]
default = ["gpuui"]
io-uring = []
# GPUI port (gpui.rs): opt-in front end on the same backend.
gpuui = ["dep:gpui", "dep:libc"]

[build-dependencies]
cc = "1"

# GPUI 0.2.2 pulls zed-async-tar -> xattr 0.2.3, which references the
# macOS-only libc::ENOATTR on Linux. Vendored one-line ENODATA shim until a
# fixed xattr release is available.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# The app runs in a debug profile for development, but cover decoding/resizing
# is CPU-bound native work where unoptimized image codecs cost seconds per
# album. Optimise the codec stack without giving up debug info for our code.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3
