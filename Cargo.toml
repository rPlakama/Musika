[package]
name = "musika"
version = "0.0.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
material-colors = { version = "0.5", features = ["quantize"] }
md-5 = "0.11"
openssl = "0.10.81"
qtbridge = "0.3.0"
reqwest = { version = "0.13.5", features = [ "json" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [ "sqlite-deserialize", "sqlite", "runtime-tokio" ] }
tokio = { version = "1.53.2", features = [ "rt", "macros", "rt-multi-thread"] }
